<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Notes 兼容性自检</title>
<style>
 body{font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;padding:14px;background:#f6f6fa;color:#1a1a22}
 h1{font-size:18px;margin:0 0 10px}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
 td{padding:9px 10px;border-bottom:1px solid #eceaf4;vertical-align:top}
 td:first-child{color:#6b6880;width:44%}
 .ok{color:#0a7d43;font-weight:600}.no{color:#c0392b;font-weight:600}
 pre{white-space:pre-wrap;word-break:break-all;background:#fff;padding:10px;border-radius:10px;font-size:12px;margin:10px 0 0}
</style></head><body>
<h1>兼容性自检</h1>
<table id="t"></table>
<pre id="ua"></pre>
<script>
var rows = [];
function add(k, v, good) {
  rows.push('<tr><td>' + k + '</td><td class="' + (good === true ? 'ok' : good === false ? 'no' : '') + '">' + v + '</td></tr>');
}
function yn(b) { return b ? '是' : '否'; }

add('安全上下文 isSecureContext', yn(window.isSecureContext), window.isSecureContext);
add('Service Worker 支持', yn('serviceWorker' in navigator), 'serviceWorker' in navigator);
add('SW 是否已接管本页', yn(!!(navigator.serviceWorker && navigator.serviceWorker.controller)), null);
add('跨源隔离 crossOriginIsolated', yn(window.crossOriginIsolated), window.crossOriginIsolated);
add('SharedArrayBuffer', typeof SharedArrayBuffer, typeof SharedArrayBuffer === 'function');

// 真造一个 SAB 试试（未隔离时构造函数会抛错）
try { new SharedArrayBuffer(8); add('能否 new SharedArrayBuffer', '可以', true); }
catch (e) { add('能否 new SharedArrayBuffer', '抛错: ' + (e && e.message), false); }

add('Atomics.wait', typeof Atomics.wait, typeof Atomics.wait === 'function');
add('WebAssembly', typeof WebAssembly, typeof WebAssembly === 'object');
add('Worker(module)', (function () {
  try { new Worker(URL.createObjectURL(new Blob([''], {type: 'text/javascript'})), {type: 'module'}); return '支持'; }
  catch (e) { return '不支持: ' + e.message; }
})(), null);
add('WebUSB', typeof navigator.usb, typeof navigator.usb);
add('屏幕', screen.width + ' x ' + screen.height + ' @' + (window.devicePixelRatio || 1) + 'x');
add('时间', new Date().toLocaleString());

document.getElementById('t').innerHTML = rows.join('');
document.getElementById('ua').textContent = 'UA:\n' + navigator.userAgent;

// 顺手把 SW 注册一下，再看一次隔离状态（和正式页同一套机制）
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('./service-worker.js', {scope: './'}).then(function (r) {
    return navigator.serviceWorker.ready.then(function () {
      add('注册 SW 后 controller', yn(!!navigator.serviceWorker.controller), null);
      document.getElementById('t').innerHTML = rows.join('');
    });
  }).catch(function (e) { add('SW 注册失败', String(e && e.message).slice(0, 120), false); document.getElementById('t').innerHTML = rows.join(''); });
}
</script>
</body></html>
